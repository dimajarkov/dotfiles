[project]
name = "pi-skill-edit"
version = "0.1.0"
description = "Exact single-occurrence file edits from the Pi IPython kernel."
requires-python = ">=3.10"
dependencies = []

[project.scripts]
edit = "edit:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edit"]
