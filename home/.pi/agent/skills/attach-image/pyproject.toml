[project]
name = "pi-skill-attach-image"
version = "0.1.0"
description = "Load on-disk images into the Pi model context."
requires-python = ">=3.10"
dependencies = ["pillow>=10.0.0"]

[project.scripts]
attach_image = "attach_image.attach_image:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/attach_image"]
